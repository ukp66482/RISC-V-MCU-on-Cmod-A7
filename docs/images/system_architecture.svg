<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z"/>
    </marker>
    <marker id="arrb" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z"/>
    </marker>
  </defs>
  <style>
    .box  { fill:white; stroke:black; stroke-width:1.3; }
    .bus  { stroke:black; stroke-width:4;   fill:none; marker-end:url(#arrb); }
    .wire { stroke:black; stroke-width:1;   fill:none; marker-end:url(#arr); }
    .dash { stroke:black; stroke-width:1;   fill:none; stroke-dasharray:5 3; }
    .bnd  { stroke:black; stroke-width:1.2; fill:none; stroke-dasharray:7 4; }
    .t    { font-size:9px; }
    .tb   { font-size:10px; font-weight:bold; }
    .ts   { font-size:8px; }
    .ti   { font-size:8px; font-style:italic; }
  </style>

  <!-- ============ FPGA boundary ============ -->
  <rect class="bnd" x="48" y="80" width="648" height="465"/>
  <text class="ti" x="688" y="538" text-anchor="end">Artix-7 FPGA (xc7a35tcpg236-1)</text>

  <!-- ============ clocking ============ -->
  <rect class="box" x="60" y="16" width="104" height="34"/>
  <text class="tb" x="112" y="30" text-anchor="middle">12 MHz</text>
  <text class="t"  x="112" y="42" text-anchor="middle">oscillator</text>
  <line class="wire" x1="112" y1="50" x2="112" y2="98"/>
  <rect class="box" x="66" y="100" width="132" height="40"/>
  <text class="tb" x="132" y="115" text-anchor="middle">Clocking Wizard</text>
  <text class="t"  x="132" y="128" text-anchor="middle">MMCM &#215;25/3</text>
  <line class="wire" x1="198" y1="120" x2="248" y2="120"/>
  <text class="ts" x="222" y="113" text-anchor="middle">100 MHz</text>
  <text class="ti" x="132" y="152" text-anchor="middle">clocks all blocks</text>

  <!-- ============ CPU ============ -->
  <rect class="box" x="250" y="95" width="280" height="115"/>
  <text class="tb" x="390" y="112" text-anchor="middle" font-size="12">MicroBlaze-V CPU</text>
  <text class="t"  x="390" y="127" text-anchor="middle">RV32IM &#183; bit-manip &#183; 100 MHz</text>
  <rect class="box" x="262" y="140" width="125" height="28"/>
  <text class="t" x="324" y="157" text-anchor="middle">16 KB I-Cache</text>
  <rect class="box" x="395" y="140" width="125" height="28"/>
  <text class="t" x="457" y="157" text-anchor="middle">16 KB D-Cache</text>
  <text class="ts" x="300" y="200" text-anchor="middle">ILMB &#183; DLMB</text>
  <text class="ts" x="430" y="200" text-anchor="middle">IC &#183; DC</text>
  <text class="ts" x="505" y="200" text-anchor="middle">DP</text>

  <!-- ============ debug ============ -->
  <rect class="box" x="560" y="100" width="120" height="40"/>
  <text class="tb" x="620" y="115" text-anchor="middle">MDM</text>
  <text class="t"  x="620" y="128" text-anchor="middle">debug (JTAG)</text>
  <line class="dash" x1="560" y1="120" x2="534" y2="120" marker-end="url(#arr)"/>
  <line class="dash" x1="680" y1="120" x2="708" y2="120"/>

  <!-- ============ USB connector (off-FPGA) ============ -->
  <rect class="box" x="712" y="98" width="146" height="46"/>
  <text class="tb" x="785" y="115" text-anchor="middle">Micro-USB</text>
  <text class="t"  x="785" y="129" text-anchor="middle">FT2232: JTAG + UART</text>

  <!-- ============ CPU buses ============ -->
  <!-- LMB -->
  <line class="bus" x1="300" y1="210" x2="300" y2="251"/>
  <line x1="292" y1="232" x2="304" y2="222" stroke="black" stroke-width="1"/>
  <text class="ts" x="308" y="228">32</text>
  <!-- cache AXI -->
  <line class="bus" x1="430" y1="210" x2="430" y2="251"/>
  <line x1="422" y1="232" x2="434" y2="222" stroke="black" stroke-width="1"/>
  <text class="ts" x="438" y="228">32</text>
  <!-- DP AXI -->
  <line class="bus" x1="505" y1="210" x2="505" y2="369"/>
  <line x1="497" y1="242" x2="509" y2="232" stroke="black" stroke-width="1"/>
  <text class="ts" x="513" y="238">32</text>

  <!-- ============ local memory ============ -->
  <rect class="box" x="210" y="255" width="180" height="80"/>
  <text class="tb" x="300" y="272" text-anchor="middle">Block RAM 128 KB</text>
  <text class="t"  x="300" y="288" text-anchor="middle">32 K bootloader</text>
  <text class="t"  x="300" y="301" text-anchor="middle">32 K ITCM &#183; 64 K DTCM</text>
  <text class="ti" x="300" y="316" text-anchor="middle">1-cycle, dual-port</text>

  <!-- ============ memory interconnect -> SRAM ============ -->
  <rect class="box" x="405" y="255" width="110" height="30"/>
  <text class="t" x="460" y="274" text-anchor="middle">SmartConnect</text>
  <line class="wire" x1="430" y1="285" x2="430" y2="308"/>
  <rect class="box" x="405" y="310" width="110" height="28"/>
  <text class="t" x="460" y="328" text-anchor="middle">AXI EMC</text>
  <line class="bus" x1="515" y1="324" x2="706" y2="324"/>
  <rect class="box" x="712" y="300" width="146" height="52"/>
  <text class="tb" x="785" y="316" text-anchor="middle">SRAM 512 KB</text>
  <text class="t"  x="785" y="330" text-anchor="middle">async CellularRAM</text>
  <text class="ts" x="785" y="343" text-anchor="middle">0x6000_0000 &#183; cached</text>

  <!-- ============ peripheral bus bar ============ -->
  <text class="ts" x="65" y="367">AXI SmartConnect &#8212; 1 master &#8594; 22 endpoints &#183; 0x40xx_xxxx</text>
  <rect x="65" y="371" width="620" height="13" fill="black"/>

  <!-- stubs bar -> peripherals -->
  <line class="wire" x1="101" y1="384" x2="101" y2="426"/>
  <line class="wire" x1="179" y1="384" x2="179" y2="426"/>
  <line class="wire" x1="257" y1="384" x2="257" y2="426"/>
  <line class="wire" x1="335" y1="384" x2="335" y2="426"/>
  <line class="wire" x1="413" y1="384" x2="413" y2="426"/>
  <line class="wire" x1="491" y1="384" x2="491" y2="426"/>
  <line class="wire" x1="569" y1="384" x2="569" y2="426"/>
  <line class="wire" x1="647" y1="384" x2="647" y2="426"/>

  <!-- ============ peripheral row ============ -->
  <rect class="box" x="65" y="430" width="72" height="60"/>
  <text class="tb" x="101" y="445" text-anchor="middle">INTC</text>
  <text class="ts" x="101" y="458" text-anchor="middle">8 inputs</text>
  <text class="ts" x="101" y="470" text-anchor="middle">&#8594; CPU IRQ</text>

  <rect class="box" x="143" y="430" width="72" height="60"/>
  <text class="tb" x="179" y="445" text-anchor="middle">Timer &#215;3</text>
  <text class="ts" x="179" y="458" text-anchor="middle">PWM &#215;3</text>
  <text class="ts" x="179" y="470" text-anchor="middle">32-bit</text>

  <rect class="box" x="221" y="430" width="72" height="60"/>
  <text class="tb" x="257" y="445" text-anchor="middle">UART &#215;2</text>
  <text class="ts" x="257" y="458" text-anchor="middle">16550</text>
  <text class="ts" x="257" y="470" text-anchor="middle">USB &#183; DIP</text>

  <rect class="box" x="299" y="430" width="72" height="60"/>
  <text class="tb" x="335" y="445" text-anchor="middle">GPIO 4&#215;7</text>
  <text class="ts" x="335" y="458" text-anchor="middle">EXTI &#215;4</text>
  <text class="ts" x="335" y="470" text-anchor="middle">A &#183; B &#183; C &#183; D</text>

  <rect class="box" x="377" y="430" width="72" height="60"/>
  <text class="tb" x="413" y="445" text-anchor="middle">I2C</text>
  <text class="ts" x="413" y="458" text-anchor="middle">100 kHz</text>
  <text class="ts" x="413" y="470" text-anchor="middle">DIP 13/14</text>

  <rect class="box" x="455" y="430" width="72" height="60"/>
  <text class="tb" x="491" y="445" text-anchor="middle">SPI</text>
  <text class="ts" x="491" y="458" text-anchor="middle">6.25 MHz</text>
  <text class="ts" x="491" y="470" text-anchor="middle">DIP 35&#8211;39</text>

  <rect class="box" x="533" y="430" width="72" height="60"/>
  <text class="tb" x="569" y="445" text-anchor="middle">XADC</text>
  <text class="ts" x="569" y="458" text-anchor="middle">12-bit ADC</text>
  <text class="ts" x="569" y="470" text-anchor="middle">DIP 15/16</text>

  <rect class="box" x="611" y="430" width="72" height="60"/>
  <text class="tb" x="647" y="445" text-anchor="middle">QSPI</text>
  <text class="ts" x="647" y="458" text-anchor="middle">flash ctrl</text>
  <text class="ts" x="647" y="470" text-anchor="middle">0x4050_0000</text>

  <!-- ============ IRQ line ============ -->
  <polyline class="wire" points="65,460 56,460 56,172 246,172"/>
  <text class="ts" x="62" y="168">IRQ</text>

  <!-- ============ QSPI -> flash chip ============ -->
  <polyline class="wire" points="683,458 700,458 700,420 708,420"/>
  <rect class="box" x="712" y="394" width="146" height="52"/>
  <text class="tb" x="785" y="410" text-anchor="middle">QSPI NOR Flash</text>
  <text class="t"  x="785" y="424" text-anchor="middle">4 MB</text>
  <text class="ts" x="785" y="437" text-anchor="middle">bitstream + application</text>

  <!-- ============ UART-USB route ============ -->
  <polyline class="dash" points="257,426 257,404 690,404 690,160 740,160 740,148"/>
  <text class="ti" x="600" y="400">UART0 (USB)</text>

  <!-- ============ DIP header ============ -->
  <line class="wire" x1="179" y1="490" x2="179" y2="561"/>
  <line class="wire" x1="257" y1="490" x2="257" y2="561"/>
  <line class="wire" x1="335" y1="490" x2="335" y2="561"/>
  <line class="wire" x1="413" y1="490" x2="413" y2="561"/>
  <line class="wire" x1="491" y1="490" x2="491" y2="561"/>
  <line class="wire" x1="569" y1="490" x2="569" y2="561"/>
  <text class="ti" x="563" y="530" text-anchor="end">analog</text>
  <rect class="box" x="65" y="565" width="620" height="30"/>
  <text class="tb" x="375" y="584" text-anchor="middle">48-pin DIP header &#183; LVCMOS33 3.3 V (not 5 V tolerant)</text>
</svg>
