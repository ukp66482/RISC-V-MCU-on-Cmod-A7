<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z"/>
    </marker>
    <marker id="arrb" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z"/>
    </marker>
    <marker id="arrs" markerWidth="5" markerHeight="5" refX="1" refY="2.5" orient="auto">
      <path d="M5,0 L0,2.5 L5,5 z"/>
    </marker>
  </defs>
  <style>
    .box  { fill:white; stroke:black; stroke-width:1.3; }
    .bus  { stroke:black; stroke-width:4; fill:none; marker-end:url(#arrb); }
    .bus2 { stroke:black; stroke-width:4; fill:none; marker-end:url(#arrb); marker-start:url(#arrs); }
    .wire { stroke:black; stroke-width:1; fill:none; marker-end:url(#arr); }
    .t    { font-size:9px; }
    .tb   { font-size:10px; font-weight:bold; }
    .ts   { font-size:8px; }
    .ti   { font-size:8px; font-style:italic; }
  </style>

  <!-- ============ CPU ============ -->
  <rect class="box" x="270" y="40" width="340" height="110"/>
  <text class="tb" x="440" y="62" text-anchor="middle" font-size="12">MicroBlaze-V CPU</text>
  <text class="t"  x="440" y="77" text-anchor="middle">RV32IM &#183; bit-manip &#183; 100 MHz</text>
  <rect class="box" x="285" y="88" width="150" height="30"/>
  <text class="t" x="360" y="107" text-anchor="middle">16 KB I-Cache</text>
  <rect class="box" x="445" y="88" width="150" height="30"/>
  <text class="t" x="520" y="107" text-anchor="middle">16 KB D-Cache</text>

  <!-- ============ BRAM via LMB ============ -->
  <rect class="box" x="40" y="55" width="150" height="85"/>
  <text class="tb" x="115" y="75" text-anchor="middle">Block RAM</text>
  <text class="t"  x="115" y="90" text-anchor="middle">128 KB</text>
  <text class="t"  x="115" y="104" text-anchor="middle">boot &#183; ITCM &#183; DTCM</text>
  <text class="ti" x="115" y="126" text-anchor="middle">1-cycle, dual-port</text>
  <line class="bus2" x1="196" y1="97" x2="264" y2="97"/>
  <text class="ts" x="230" y="88" text-anchor="middle">ILMB &#183; DLMB</text>
  <line x1="224" y1="106" x2="234" y2="96" stroke="black" stroke-width="1"/>
  <text class="ts" x="238" y="106">32</text>

  <!-- ============ four AXI masters ============ -->
  <line class="wire" x1="310" y1="150" x2="310" y2="306"/>
  <text class="ts" x="314" y="168">M_AXI_IP</text>
  <line class="bus"  x1="400" y1="150" x2="400" y2="304"/>
  <text class="ts" x="404" y="182">M_AXI_IC</text>
  <line x1="392" y1="240" x2="404" y2="230" stroke="black" stroke-width="1"/>
  <text class="ts" x="407" y="240">32</text>
  <line class="bus"  x1="480" y1="150" x2="480" y2="304"/>
  <text class="ts" x="484" y="168">M_AXI_DC</text>
  <line x1="472" y1="240" x2="484" y2="230" stroke="black" stroke-width="1"/>
  <text class="ts" x="487" y="240">32</text>
  <polyline class="wire" points="570,150 570,213 616,213"/>
  <text class="ts" x="574" y="168">M_AXI_DP</text>

  <!-- ============ axi_periph ============ -->
  <rect class="box" x="620" y="190" width="220" height="46"/>
  <text class="tb" x="730" y="208" text-anchor="middle">axi_periph</text>
  <text class="t"  x="730" y="222" text-anchor="middle">AXI SmartConnect &#183; 1 &#8594; 22</text>

  <!-- peripherals -->
  <line class="wire" x1="730" y1="236" x2="730" y2="286"/>
  <rect class="box" x="620" y="290" width="220" height="56"/>
  <text class="tb" x="730" y="308" text-anchor="middle">Peripherals &#215;21</text>
  <text class="t"  x="730" y="322" text-anchor="middle">0x40xx_xxxx</text>
  <text class="ti" x="730" y="337" text-anchor="middle">registers &#8212; never cached</text>

  <!-- M21: DP window to SRAM -->
  <polyline class="wire" points="640,236 640,268 560,268 560,332 504,332"/>
  <text class="ti" x="600" y="262" text-anchor="middle">M21: DP &#8594; SRAM</text>

  <!-- ============ smartconnect_0 ============ -->
  <rect class="box" x="300" y="310" width="200" height="44"/>
  <text class="tb" x="400" y="328" text-anchor="middle">smartconnect_0</text>
  <text class="t"  x="400" y="342" text-anchor="middle">4 masters &#8594; 1</text>

  <!-- ============ EMC + SRAM ============ -->
  <line class="wire" x1="400" y1="354" x2="400" y2="384"/>
  <rect class="box" x="300" y="388" width="200" height="34"/>
  <text class="t" x="400" y="409" text-anchor="middle">AXI EMC</text>
  <line class="bus" x1="400" y1="422" x2="400" y2="452"/>
  <rect class="box" x="300" y="456" width="200" height="70"/>
  <text class="tb" x="400" y="476" text-anchor="middle">SRAM 512 KB</text>
  <text class="t"  x="400" y="492" text-anchor="middle">0x6000_0000 &#8211; 0x6007_FFFF</text>
  <text class="ti" x="400" y="510" text-anchor="middle">the only cached range</text>

  <!-- ============ routing note ============ -->
  <text class="tb" x="40" y="430" font-size="9">Port routing = pure address decode:</text>
  <text class="ts" x="40" y="446">0x6000_0000 &#8211; 0x6007_FFFF &#8594; IC / DC (cached)</text>
  <text class="ts" x="40" y="460">all other addresses &#8594; IP / DP (uncached)</text>
  <text class="ts" x="40" y="482">thick lines = cache-line / local buses</text>
  <text class="ts" x="40" y="496">thin lines = single-beat uncached access</text>
</svg>
