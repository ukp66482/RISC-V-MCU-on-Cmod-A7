<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>
  <style>
    .box  { fill:white; stroke:black; stroke-width:1.3; }
    .r    { fill:white; stroke:black; stroke-width:1.2; }
    .wire { stroke:black; stroke-width:1; fill:none; marker-end:url(#arr); }
    .ln   { stroke:black; stroke-width:1; fill:none; }
    .bnd  { stroke:black; stroke-width:1; fill:none; stroke-dasharray:6 4; }
    .t    { font-size:9px; }
    .tb   { font-size:10px; font-weight:bold; }
    .ts   { font-size:8px; }
    .ti   { font-size:8px; font-style:italic; }
  </style>

  <!-- ============ DIP pin terminal ============ -->
  <circle cx="44" cy="150" r="4" fill="white" stroke="black" stroke-width="1.3"/>
  <text class="tb" x="80" y="174" text-anchor="end">DIP pin 15 / 16</text>
  <text class="ts" x="80" y="187" text-anchor="end">ADC_0 / ADC_1</text>
  <text class="ts" x="80" y="200" text-anchor="end">0 &#8211; 3.3 V</text>

  <!-- on-board network boundary -->
  <rect class="bnd" x="84" y="96" width="306" height="178"/>
  <text class="ti" x="90" y="110">on-board, one network per analog pin</text>

  <!-- ============ divider top branch ============ -->
  <line class="ln" x1="48" y1="150" x2="90" y2="150"/>
  <rect class="r" x="90" y="142" width="64" height="16"/>
  <text class="ts" x="122" y="136" text-anchor="middle">2.32 k&#937; 1%</text>
  <line class="ln" x1="154" y1="150" x2="196" y2="150"/>
  <circle cx="196" cy="150" r="3"/>

  <!-- divider bottom leg to GND -->
  <line class="ln" x1="196" y1="150" x2="196" y2="178"/>
  <rect class="r" x="188" y="178" width="16" height="48"/>
  <text class="ts" x="182" y="205" text-anchor="end">1 k&#937; 1%</text>
  <line class="ln" x1="196" y1="226" x2="196" y2="246"/>
  <line class="ln" x1="184" y1="246" x2="208" y2="246"/>
  <line class="ln" x1="188" y1="251" x2="204" y2="251"/>
  <line class="ln" x1="192" y1="256" x2="200" y2="256"/>

  <!-- series filter to ain_p -->
  <line class="ln" x1="196" y1="150" x2="240" y2="150"/>
  <rect class="r" x="240" y="142" width="56" height="16"/>
  <text class="ts" x="268" y="136" text-anchor="middle">140 &#937;</text>
  <line class="ln" x1="296" y1="150" x2="340" y2="150"/>
  <circle cx="340" cy="150" r="3"/>

  <!-- filter capacitor between ain_p and ain_n -->
  <line class="ln" x1="340" y1="150" x2="340" y2="172"/>
  <line x1="326" y1="172" x2="354" y2="172" stroke="black" stroke-width="2"/>
  <line x1="326" y1="180" x2="354" y2="180" stroke="black" stroke-width="2"/>
  <line class="ln" x1="340" y1="180" x2="340" y2="210"/>
  <text class="ts" x="360" y="180">1 nF</text>
  <circle cx="340" cy="210" r="3"/>

  <!-- n-side resistor to GND -->
  <line class="ln" x1="340" y1="210" x2="306" y2="210"/>
  <rect class="r" x="250" y="202" width="56" height="16"/>
  <text class="ts" x="278" y="196" text-anchor="middle">845 &#937;</text>
  <line class="ln" x1="250" y1="210" x2="238" y2="210"/>
  <line class="ln" x1="238" y1="210" x2="238" y2="240"/>
  <line class="ln" x1="226" y1="240" x2="250" y2="240"/>
  <line class="ln" x1="230" y1="245" x2="246" y2="245"/>
  <line class="ln" x1="234" y1="250" x2="242" y2="250"/>

  <!-- ============ to XADC ============ -->
  <line class="wire" x1="340" y1="150" x2="596" y2="150"/>
  <text class="ts" x="560" y="144">ain_p</text>
  <line class="wire" x1="340" y1="210" x2="596" y2="210"/>
  <text class="ts" x="560" y="224">ain_n</text>

  <rect class="box" x="600" y="90" width="230" height="160"/>
  <text class="tb" x="715" y="120" text-anchor="middle" font-size="12">Artix-7 XADC</text>
  <text class="t"  x="715" y="140" text-anchor="middle">VAUX4 / VAUX12</text>
  <text class="t"  x="715" y="158" text-anchor="middle">0 &#8211; 1 V differential input</text>
  <text class="ti" x="715" y="176" text-anchor="middle">12-bit successive approximation</text>

  <text class="ts" x="32" y="295">divider: 1 k / (2.32 k + 1 k) &#8776; 0.301 &#8594; 3.3 V at the DIP pin &#8776; 1.0 V at the XADC</text>
</svg>
