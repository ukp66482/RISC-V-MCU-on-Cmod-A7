<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <rect x="0" y="0" width="600" height="360" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>
  <style>
    .box { fill:white; stroke:black; stroke-width:1.3; }
    .wire{ stroke:black; stroke-width:1; fill:none; marker-end:url(#arr); }
    .t   { font-size:9px; }
    .tb  { font-size:11px; font-weight:bold; }
    .ts  { font-size:8px; }
    .ti  { font-size:8px; font-style:italic; }
  </style>

  <!-- ============ host debugger ============ -->
  <rect class="box" x="20" y="132" width="140" height="68"/>
  <text class="tb" x="90" y="156" text-anchor="middle">Debugger</text>
  <text class="t"  x="90" y="172" text-anchor="middle">Vitis / xsdb</text>
  <text class="ts" x="90" y="187" text-anchor="middle">host PC, over USB</text>

  <!-- ============ JTAG link ============ -->
  <line class="wire" x1="160" y1="166" x2="236" y2="166"/>
  <text class="ts" x="198" y="161" text-anchor="middle">JTAG</text>

  <!-- ============ debug module ============ -->
  <rect class="box" x="238" y="132" width="122" height="68"/>
  <text class="tb" x="299" y="162" text-anchor="middle">Debug</text>
  <text class="tb" x="299" y="176" text-anchor="middle">Module</text>

  <!-- ============ fan-out to what it can reach ============ -->
  <polyline class="wire" points="360,166 400,166 400,46 438,46"/>
  <polyline class="wire" points="360,166 400,166 400,126 438,126"/>
  <polyline class="wire" points="360,166 400,166 400,206 438,206"/>
  <polyline class="wire" points="360,166 400,166 400,286 438,286"/>

  <!-- ============ targets ============ -->
  <rect class="box" x="440" y="20" width="150" height="52"/>
  <text class="tb" x="515" y="41" text-anchor="middle">RISC-V Core</text>
  <text class="ts" x="515" y="55" text-anchor="middle">halt &#183; single-step &#183; breakpoints</text>
  <text class="ts" x="515" y="67" text-anchor="middle">register access</text>

  <rect class="box" x="440" y="100" width="150" height="52"/>
  <text class="tb" x="515" y="123" text-anchor="middle">Memory</text>
  <text class="ts" x="515" y="138" text-anchor="middle">read / write</text>

  <rect class="box" x="440" y="180" width="150" height="52"/>
  <text class="tb" x="515" y="203" text-anchor="middle">Peripheral Registers</text>
  <text class="ts" x="515" y="218" text-anchor="middle">read / write</text>

  <rect class="box" x="440" y="260" width="150" height="52"/>
  <text class="tb" x="515" y="283" text-anchor="middle">System Reset</text>
  <text class="ts" x="515" y="298" text-anchor="middle">restart the processor</text>

  <!-- ============ caption ============ -->
  <text class="ti" x="20" y="348">Debug access is implemented in hardware; the core can be halted even when the application is unresponsive.</text>
</svg>
