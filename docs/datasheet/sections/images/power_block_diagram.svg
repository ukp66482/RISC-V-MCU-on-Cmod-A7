<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <rect x="0" y="0" width="880" height="310" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z"/>
    </marker>
    <marker id="arrb" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z"/>
    </marker>
  </defs>
  <style>
    .box  { fill:white; stroke:black; stroke-width:1.3; }
    .bus  { stroke:black; stroke-width:4; fill:none; marker-end:url(#arrb); }
    .wire { stroke:black; stroke-width:1; fill:none; marker-end:url(#arr); }
    .ln   { stroke:black; stroke-width:1; fill:none; }
    .t    { font-size:9px; }
    .tb   { font-size:10px; font-weight:bold; }
    .ts   { font-size:8px; }
    .ti   { font-size:8px; font-style:italic; }
  </style>

  <!-- ============ sources ============ -->
  <rect class="box" x="30" y="60" width="150" height="46"/>
  <text class="tb" x="105" y="79" text-anchor="middle">Micro-USB</text>
  <text class="t"  x="105" y="94" text-anchor="middle">USB5V0 &#183; 4.5 &#8211; 5.5 V</text>

  <line class="ln" x1="180" y1="83" x2="212" y2="83"/>
  <path d="M212,73 L212,93 L230,83 z"/>
  <line x1="230" y1="73" x2="230" y2="93" stroke="black" stroke-width="2"/>
  <text class="ts" x="221" y="66" text-anchor="middle">Schottky</text>
  <line class="ln" x1="230" y1="83" x2="300" y2="83"/>

  <rect class="box" x="30" y="150" width="150" height="46"/>
  <text class="tb" x="105" y="169" text-anchor="middle">External supply</text>
  <text class="t"  x="105" y="184" text-anchor="middle">DIP pin 24 &#183; 3.32 &#8211; 5.5 V</text>
  <polyline class="ln" points="180,173 300,173 300,83"/>
  <circle cx="300" cy="83" r="3"/>
  <text class="tb" x="306" y="74">VU</text>
  <line class="wire" x1="300" y1="83" x2="356" y2="83"/>

  <text class="ti" x="30" y="218">VU is DIP pin 24: an output when USB powers the board,</text>
  <text class="ti" x="30" y="231">an input when running from an external supply.</text>

  <!-- ============ regulator ============ -->
  <rect class="box" x="360" y="50" width="190" height="160"/>
  <text class="tb" x="455" y="74" text-anchor="middle" font-size="11">LTC3569</text>
  <text class="t"  x="455" y="89" text-anchor="middle">triple buck regulator</text>

  <!-- ============ rails ============ -->
  <line class="bus" x1="550" y1="110" x2="612" y2="110"/>
  <rect class="box" x="618" y="92" width="230" height="36"/>
  <text class="tb" x="733" y="107" text-anchor="middle">VCC1V0 &#8212; 1.00 V &#183; 1.2 A</text>
  <text class="t"  x="733" y="121" text-anchor="middle">FPGA core &#183; Block RAM</text>

  <line class="bus" x1="550" y1="145" x2="612" y2="145"/>
  <rect class="box" x="618" y="127" width="230" height="36"/>
  <text class="tb" x="733" y="142" text-anchor="middle">VCC1V8 &#8212; 1.80 V &#183; 0.6 A</text>
  <text class="t"  x="733" y="156" text-anchor="middle">FPGA AUX &#183; XADC &#183; USB core</text>

  <line class="bus" x1="550" y1="180" x2="612" y2="180"/>
  <rect class="box" x="618" y="162" width="230" height="36"/>
  <text class="tb" x="733" y="177" text-anchor="middle">VCC3V3 &#8212; 3.30 V &#183; 0.6 A</text>
  <text class="t"  x="733" y="191" text-anchor="middle">SRAM &#183; USB ctrl &#183; LEDs &#183; user I/O</text>

  <!-- ============ power good ============ -->
  <line class="wire" x1="455" y1="210" x2="455" y2="246"/>
  <rect class="box" x="395" y="250" width="120" height="34"/>
  <text class="tb" x="455" y="265" text-anchor="middle">PWRGD &#8594; LD5</text>
  <text class="t"  x="455" y="278" text-anchor="middle">Power-On LED</text>

  <text class="ti" x="30" y="282">Never let USB and an external source drive VU at the same time &#8212;</text>
  <text class="ti" x="30" y="295">add a series Schottky on the external feed (diode-OR) if both must stay connected.</text>
</svg>
