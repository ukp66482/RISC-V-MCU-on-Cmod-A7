<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <rect x="0" y="0" width="880" height="600" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>
  <style>
    .box  { fill:white; stroke:black; stroke-width:1.3; }
    .dash { stroke:black; stroke-width:1; fill:none; stroke-dasharray:5 3; }
    .dasha{ stroke:black; stroke-width:1; fill:none; stroke-dasharray:5 3; marker-end:url(#arr); }
    .wire { stroke:black; stroke-width:1; fill:none; marker-end:url(#arr); }
    .t    { font-size:9px; }
    .tb   { font-size:10px; font-weight:bold; }
    .ts   { font-size:8px; }
    .ti   { font-size:8px; font-style:italic; }
    .addr { font-size:8px; font-family:"Liberation Mono", monospace; }
  </style>

  <!-- ================= CPU address space (left bar) ================= -->
  <text class="tb" x="285" y="38" text-anchor="middle" font-size="11">CPU address space</text>
  <text class="ti" x="285" y="52" text-anchor="middle">(not to scale &#183; low addresses at top)</text>

  <!-- BRAM: bootloader / ITCM / DTCM -->
  <rect class="box" x="170" y="60" width="230" height="48"/>
  <text class="t"  x="285" y="80" text-anchor="middle">Bootloader &#8212; 32 KB</text>
  <text class="ts" x="285" y="94" text-anchor="middle">reserved (part of the hardware image)</text>
  <text class="addr" x="162" y="66" text-anchor="end">0x0000 0000</text>

  <rect class="box" x="170" y="108" width="230" height="48"/>
  <text class="t"  x="285" y="128" text-anchor="middle">ITCM &#8212; 32 KB</text>
  <text class="ts" x="285" y="142" text-anchor="middle">fast code</text>
  <text class="addr" x="162" y="114" text-anchor="end">0x0000 8000</text>

  <rect class="box" x="170" y="156" width="230" height="66"/>
  <text class="t"  x="285" y="176" text-anchor="middle">DTCM &#8212; 64 KB</text>
  <text class="ts" x="285" y="190" text-anchor="middle">data &#183; stack</text>
  <text class="addr" x="162" y="162" text-anchor="end">0x0001 0000</text>
  <line class="wire" x1="330" y1="214" x2="330" y2="198"/>
  <text class="ts" x="338" y="208" text-anchor="start">stack</text>
  <text class="addr" x="162" y="226" text-anchor="end">0x0002 0000</text>

  <!-- unmapped gap -->
  <line class="dash" x1="170" y1="222" x2="170" y2="268"/>
  <line class="dash" x1="400" y1="222" x2="400" y2="268"/>
  <text class="ti" x="285" y="248" text-anchor="middle">(unmapped &#8212; access faults)</text>

  <!-- peripherals -->
  <rect class="box" x="170" y="268" width="230" height="52"/>
  <text class="t"  x="285" y="288" text-anchor="middle">Peripheral registers</text>
  <text class="ts" x="285" y="302" text-anchor="middle">uncached</text>
  <text class="addr" x="162" y="274" text-anchor="end">0x4000 0000</text>

  <!-- unmapped gap -->
  <line class="dash" x1="170" y1="320" x2="170" y2="366"/>
  <line class="dash" x1="400" y1="320" x2="400" y2="366"/>
  <text class="ti" x="285" y="346" text-anchor="middle">(unmapped &#8212; access faults)</text>

  <!-- SRAM -->
  <rect class="box" x="170" y="366" width="230" height="120"/>
  <text class="tb" x="285" y="392" text-anchor="middle">External SRAM &#8212; 512 KB</text>
  <text class="t"  x="285" y="410" text-anchor="middle">application code &#183; data &#183; heap</text>
  <text class="ts" x="285" y="426" text-anchor="middle">cached (write-through)</text>
  <text class="addr" x="162" y="372" text-anchor="end">0x6000 0000</text>
  <text class="addr" x="162" y="492" text-anchor="end">0x6008 0000</text>

  <!-- ================= QSPI flash (right bar) ================= -->
  <text class="tb" x="660" y="38" text-anchor="middle" font-size="11">QSPI flash &#8212; 4 MB</text>
  <text class="ti" x="660" y="52" text-anchor="middle">storage only &#8212; own offsets, no CPU address window</text>

  <rect class="box" x="560" y="80" width="200" height="90"/>
  <text class="t"  x="660" y="106" text-anchor="middle">Hardware image</text>
  <text class="ts" x="660" y="120" text-anchor="middle">includes the bootloader</text>
  <text class="ts" x="660" y="134" text-anchor="middle">loaded by the chip itself at power-on</text>
  <text class="addr" x="552" y="86" text-anchor="end">0x00 0000</text>

  <rect class="box" x="560" y="170" width="200" height="80"/>
  <text class="t"  x="660" y="196" text-anchor="middle">Application slot</text>
  <text class="ts" x="660" y="210" text-anchor="middle">application, as an SREC image</text>
  <text class="ts" x="660" y="224" text-anchor="middle">1.875 MB &#8212; fits a full 512 KB application</text>
  <text class="addr" x="552" y="176" text-anchor="end">0x22 0000</text>

  <line class="dash" x1="560" y1="250" x2="560" y2="300"/>
  <line class="dash" x1="760" y1="250" x2="760" y2="300"/>
  <text class="ti" x="660" y="279" text-anchor="middle">(rest of the slot)</text>
  <text class="addr" x="552" y="306" text-anchor="end">0x40 0000</text>

  <!-- restore arrow: hardware image -> bootloader region -->
  <path class="dasha" d="M 560 94 L 404 94"/>
  <text class="ti" x="482" y="106" text-anchor="middle">restored at power-on</text>

  <!-- boot copy arrow: app image -> SRAM -->
  <path class="dasha" d="M 560 205 L 480 205 L 480 426 L 404 426"/>
  <text class="ti" x="519" y="197" text-anchor="middle">copied at power-on</text>
</svg>
