<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 96" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <rect x="0" y="0" width="730" height="96" fill="white"/>
  <defs>
    <pattern id="rsv" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="black" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    .cell { fill:white; stroke:black; stroke-width:1; }
    .bit  { font-size:8px; }
    .fld  { font-size:8.5px; font-weight:bold; }
    .rsvt { font-size:8.5px; font-style:italic; }
  </style>

  <!-- reserved 31:16 -->
  <rect class="cell" x="16" y="42" width="290" height="34"/>
  <rect x="16" y="42" width="290" height="34" fill="url(#rsv)" stroke="none"/>
  <rect x="131" y="52" width="60" height="14" fill="white"/>
  <text class="rsvt" x="161" y="63" text-anchor="middle">Reserved</text>
  <text class="bit" x="22" y="37" text-anchor="start">31</text>
  <text class="bit" x="300" y="37" text-anchor="end">16</text>

  <!-- sample 15:4 -->
  <rect class="cell" x="306" y="42" width="290" height="34"/>
  <text class="bit" x="312" y="37" text-anchor="start">15</text>
  <text class="bit" x="590" y="37" text-anchor="end">4</text>
  <text class="fld" x="451" y="63" text-anchor="middle">sample [11:0]</text>

  <!-- unused 3:0 -->
  <rect class="cell" x="596" y="42" width="118" height="34"/>
  <text class="bit" x="602" y="37" text-anchor="start">3</text>
  <text class="bit" x="708" y="37" text-anchor="end">0</text>
  <text class="fld" x="655" y="63" text-anchor="middle">0 0 0 0</text>
</svg>
