<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 476" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <rect x="0" y="0" width="560" height="476" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>
  <style>
    .box { fill:white; stroke:black; stroke-width:1.3; }
    .wire{ stroke:black; stroke-width:1.2; fill:none; marker-end:url(#arr); }
    .tb  { font-size:11px; font-weight:bold; }
    .ts  { font-size:8px; }
    .code{ font-family:"Liberation Mono", monospace; font-size:8px; }
  </style>

  <!-- 1 power-on (start) -->
  <rect class="box" x="200" y="20" width="160" height="34" rx="16"/>
  <text class="tb" x="280" y="41" text-anchor="middle">Power-on</text>
  <line class="wire" x1="280" y1="54" x2="280" y2="90"/>

  <!-- 2 FPGA config -->
  <rect class="box" x="80" y="90" width="400" height="50"/>
  <text class="tb" x="280" y="110" text-anchor="middle">FPGA configures itself from the flash bitstream</text>
  <text class="ts" x="280" y="126" text-anchor="middle">the bootloader is restored into on-chip RAM at <tspan class="code">0x0</tspan></text>
  <line class="wire" x1="280" y1="140" x2="280" y2="172"/>

  <!-- 3 CPU runs bootloader -->
  <rect class="box" x="80" y="172" width="400" height="34"/>
  <text class="tb" x="280" y="193" text-anchor="middle">The CPU leaves reset and runs the bootloader</text>
  <line class="wire" x1="280" y1="206" x2="280" y2="238"/>

  <!-- 4 read SREC -->
  <rect class="box" x="80" y="238" width="400" height="50"/>
  <text class="tb" x="280" y="258" text-anchor="middle">Bootloader reads the application image (SREC)</text>
  <text class="ts" x="280" y="274" text-anchor="middle">from flash at <tspan class="code">0x22 0000</tspan></text>
  <line class="wire" x1="280" y1="288" x2="280" y2="320"/>

  <!-- 5 copy to SRAM -->
  <rect class="box" x="80" y="320" width="400" height="50"/>
  <text class="tb" x="280" y="340" text-anchor="middle">Copies each record to the address it names</text>
  <text class="ts" x="280" y="356" text-anchor="middle">every record lands in SRAM (<tspan class="code">0x6000 0000</tspan>)</text>
  <line class="wire" x1="280" y1="370" x2="280" y2="402"/>

  <!-- 6 jump (end) -->
  <rect class="box" x="110" y="402" width="340" height="48" rx="16"/>
  <text class="tb" x="280" y="422" text-anchor="middle">Jumps to the entry point</text>
  <text class="ts" x="280" y="438" text-anchor="middle">the application runs from SRAM</text>
</svg>
