<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 96" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <rect x="0" y="0" width="730" height="96" fill="white"/>
  <defs>
    <pattern id="rsv" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="black" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    .cell { fill:white; stroke:black; stroke-width:1; }
    .bit  { font-size:8px; }
    .fld  { font-size:8px; font-weight:bold; }
    .rsvt { font-size:8.5px; font-style:italic; }
  </style>

  <!-- bit 31 GIE -->
  <rect class="cell" x="16" y="42" width="48" height="34"/>
  <text class="bit" x="40" y="37" text-anchor="middle">31</text>
  <text class="fld" x="40" y="63" text-anchor="middle">GIE</text>

  <!-- reserved 30:0 -->
  <rect class="cell" x="64" y="42" width="650" height="34"/>
  <rect x="64" y="42" width="650" height="34" fill="url(#rsv)" stroke="none"/>
  <rect x="359" y="52" width="60" height="14" fill="white"/>
  <text class="rsvt" x="389" y="63" text-anchor="middle">Reserved</text>
  <text class="bit" x="70" y="37" text-anchor="start">30</text>
  <text class="bit" x="708" y="37" text-anchor="end">0</text>
</svg>
