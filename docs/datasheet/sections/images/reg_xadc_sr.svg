<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 96" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <rect x="0" y="0" width="730" height="96" fill="white"/>
  <defs>
    <pattern id="rsv" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="black" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    .cell { fill:white; stroke:black; stroke-width:1; }
    .bit  { font-size:8px; }
    .fld  { font-size:8px; font-weight:bold; }
    .rsvt { font-size:8.5px; font-style:italic; }
  </style>

  <rect class="cell" x="16" y="42" width="122" height="34"/>
  <rect x="16" y="42" width="122" height="34" fill="url(#rsv)" stroke="none"/>
  <rect x="47" y="52" width="60" height="14" fill="white"/>
  <text class="rsvt" x="77" y="63" text-anchor="middle">Reserved</text>
  <text class="bit" x="22" y="37" text-anchor="start">31</text>
  <text class="bit" x="132" y="37" text-anchor="end">12</text>
  <rect class="cell" x="138" y="42" width="48" height="34"/>
  <text class="bit" x="162" y="37" text-anchor="middle">11</text>
  <text class="fld" x="162" y="63" text-anchor="middle">JTBSY</text>
  <rect class="cell" x="186" y="42" width="48" height="34"/>
  <text class="bit" x="210" y="37" text-anchor="middle">10</text>
  <text class="fld" x="210" y="63" text-anchor="middle">JTMOD</text>
  <rect class="cell" x="234" y="42" width="48" height="34"/>
  <text class="bit" x="258" y="37" text-anchor="middle">9</text>
  <text class="fld" x="258" y="63" text-anchor="middle">JTLCK</text>
  <rect class="cell" x="282" y="42" width="48" height="34"/>
  <text class="bit" x="306" y="37" text-anchor="middle">8</text>
  <text class="fld" x="306" y="63" text-anchor="middle">BUSY</text>
  <rect class="cell" x="330" y="42" width="48" height="34"/>
  <text class="bit" x="354" y="37" text-anchor="middle">7</text>
  <text class="fld" x="354" y="63" text-anchor="middle">EOS</text>
  <rect class="cell" x="378" y="42" width="48" height="34"/>
  <text class="bit" x="402" y="37" text-anchor="middle">6</text>
  <text class="fld" x="402" y="63" text-anchor="middle">EOC</text>
  <rect class="cell" x="426" y="42" width="288" height="34"/>
  <text class="bit" x="432" y="37" text-anchor="start">5</text>
  <text class="bit" x="708" y="37" text-anchor="end">0</text>
  <text class="fld" x="570" y="63" text-anchor="middle">CHANNEL[5:0]</text>
</svg>
