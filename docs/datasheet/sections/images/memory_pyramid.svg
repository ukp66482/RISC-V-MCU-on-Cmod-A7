<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Liberation Sans, Helvetica, Arial, sans-serif" fill="black">
  <rect x="0" y="0" width="680" height="400" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>
  <style>
    .py  { fill:white; stroke:black; stroke-width:1.3; }
    .div { stroke:black; stroke-width:1; }
    .lead{ stroke:black; stroke-width:0.8; }
    .ax  { stroke:black; stroke-width:1; fill:none; marker-end:url(#arr); }
    .t   { font-size:9px; }
    .tb  { font-size:11px; font-weight:bold; }
    .ts  { font-size:8px; }
    .ti  { font-size:8px; font-style:italic; }
  </style>

  <!-- ============ pyramid ============ -->
  <polygon class="py" points="230,32 330,32 520,360 40,360"/>
  <line class="div" x1="193" y1="95"  x2="367" y2="95"/>
  <line class="div" x1="147" y1="175" x2="413" y2="175"/>
  <line class="div" x1="95"  y1="265" x2="465" y2="265"/>

  <!-- ============ band labels ============ -->
  <text class="tb" x="280" y="66"  text-anchor="middle">Registers</text>

  <text class="tb" x="280" y="130" text-anchor="middle">Tightly-coupled memory</text>
  <text class="t"  x="280" y="144" text-anchor="middle">128 KB</text>

  <text class="tb" x="280" y="214" text-anchor="middle">External SRAM</text>
  <text class="t"  x="280" y="228" text-anchor="middle">512 KB &#183; cached</text>

  <text class="tb" x="280" y="308" text-anchor="middle">QSPI flash</text>
  <text class="t"  x="280" y="322" text-anchor="middle">4 MB</text>

  <!-- ============ latency annotations (right) ============ -->
  <line class="lead" x1="348" y1="63"  x2="536" y2="63"/>
  <text class="ti" x="540" y="66">in the core</text>

  <line class="lead" x1="390" y1="135" x2="536" y2="135"/>
  <text class="ti" x="540" y="138">1 cycle</text>

  <line class="lead" x1="440" y1="221" x2="536" y2="221"/>
  <text class="ti" x="540" y="218">1-cycle hit</text>
  <text class="ti" x="540" y="228">&#8776;151-cycle miss</text>

  <line class="lead" x1="494" y1="315" x2="536" y2="315"/>
  <text class="ti" x="540" y="312">storage</text>
  <text class="ti" x="540" y="322">copied to SRAM at boot</text>

  <!-- ============ speed axis (left, rotated to clear the base) ============ -->
  <line class="ax" x1="24" y1="356" x2="24" y2="44"/>
  <text class="ti" x="14" y="96"  transform="rotate(-90 14 96)"  text-anchor="middle">faster</text>
  <text class="ti" x="14" y="312" transform="rotate(-90 14 312)" text-anchor="middle">slower</text>
</svg>
